# FloodForge AI - pilot configuration. Single source of truth for all modules.
# Values marked PLACEHOLDER are assumptions the team should refine.

pilot:
  name: nullah_lai_pilot
  # Real 200x200 (6 km x 6 km) Nullah Lai corridor spanning Islamabad & Rawalpindi.
  bbox_wgs84: {west: 73.03, south: 33.61, east: 73.09, north: 33.67}

grid:
  crs: "EPSG:32643"      # UTM zone 43N (metres) - Rawalpindi/Islamabad
  cell_size_m: 30        # matches Copernicus DEM native resolution

scenario_limits:
  rainfall_mm_per_hr: {min: 5, max: 150, default: 50}
  duration_hr:        {min: 0.5, max: 24,  default: 2}
  budget_pkr:         {min: 5000000, max: 500000000, default: 50000000}

# ESA WorldCover class -> runoff coefficient (used when synthetic twin is active).
runoff_coefficients:
  10: 0.15   # tree cover
  20: 0.25   # shrubland
  30: 0.30   # grassland
  40: 0.35   # cropland
  50: 0.85   # built-up
  60: 0.50   # bare / sparse
  80: 1.00   # water

# PLACEHOLDER unit costs and effects aligned to ward-scale civil works.
interventions:
  storage:           {cost_per_m3_pkr: 320,  unit: m3,        default_size: 18000}
  permeable_surface: {cost_per_m2_pkr: 210,  unit: m2,        runoff_reduction: 0.40, default_size: 18000}
  drainage:          {cost_per_m3hr_pkr: 400, unit: m3_per_hr, default_size: 12000}

exposure:
  # Modeled accumulation above this (mm, screening proxy) counts as "exposed"
  threshold_mm: 50

paths:
  raw: data/raw
  processed: data/processed
  clipped: data/processed/clipped
